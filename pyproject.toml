[project]
name = "anthropic-proxy"
version = "0.1.0"
description = "Proxy that translates the Anthropic API to OpenAI via LiteLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "litellm>=1.81.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.70",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 140
exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
preview = true
# Active rule set. Commented-out categories below are intentionally disabled
# with a rationale — uncomment when ready. Each entry mirrors the user's
# original broad proposal; only the most verbose / refactor-out-of-scope
# categories are turned off.
select = [
    "A",     # builtin shadowing
    "B",     # bugbear
    "BLE",   # blind-except: catches `except Exception:` not gated by `_debug_*` helpers
    "C4",    # comprehensions
    "COM",   # commas
    "E",     # pycodestyle errors
    "EM",    # exception messages
    "ERA",   # commented-out-code
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FLY",   # flynt — f-string conversions
    "FURB",  # refurb — caught 1 if/else→or
    "G",     # logging — caught 32 lazy-f-string issues
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "ISC",   # implicit string concat
    "LOG",   # flake8-logging
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PT",    # pytest-style (per-file-ignored on server.py; enabled in tests.py)
    "PTH",   # pathlib — caught 4 os.path uses
    "Q",     # quotes
    "RET",   # return-statement
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "SIM",   # simplify
    "SLF",   # private-member-access (allowed via per-file-ignores in tests.py)
    "TCH",   # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    # --- below: categories commented out by triage. Uncomment to enable ---
    # "ANN",   # flake8-annotations — 96 hits, mostly on @override mirror methods where ty already forbids renaming params; add case-by-case, not blanket-enforce
    # "ARG",   # flake8-unused-arguments — ARG001 fires on mirror signatures; instead, specific `unused-function-argument` ignore below
    # "ASYNC", # flake8-async — no async-specific findings in this codebase
    # "C90",   # mccabe (max-complexity=10) — handle_streaming is intentionally long; refactor separately before enabling
    # "D",     # pydocstyle — 84 hits on server.py, would force adding docstrings to every Pydantic validator / helper / @override mirror; docstrings added case-by-case, not blanket-enforce
    # "DOC",   # pydocstyle-docstring — subset of D; same rationale
    # "DTZ",   # flake8-datetimez — no datetime usage in this codebase
    # "EXE",   # executable — shebang handling; no findings
    # "FIX",   # flake8-fixme — no FIXME/TODO/XXX blocks in production code
    # "INP",   # flake8-no-pep420 — no implicit namespace packages
    # "INT",   # flake8-gettext — no i18n usage
    # "N",     # pep8-naming — N805 fires on Pydantic @field_validator (uses `cls`); if re-enabled, configure `classmethod-decorators = ["field_validator", "model_validator"]`
    # "PL",    # Pylint (PLR0911-0917, PLR1702, PLW*) — too-many-* are refactoring opportunities on handle_streaming; revisit when that gets refactored
    # "SLOT",  # flake8-slots — no class slots design; out of scope
    # "TD",    # flake8-todos — duplicate of FIX
]
# False positives / intentional suppressions.
ignore = [
    "hardcoded-bind-all-interfaces",   # S104 — dev-server default (0.0.0.0)
    "unused-function-argument",        # ARG001 — `_get_encoding`/`_encoding_for_model`/`_configure_logging` mirror upstream signatures
    "raise-vanilla-args",              # TRY003 — user prefers `raise RuntimeError("msg")` inline over `msg = "..."; raise RuntimeError(msg)`
    "raw-string-in-exception",         # EM101 — same reason as TRY003
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["server", "tests"]

[tool.ruff.lint.per-file-ignores]
# Test-context suppressions. The same select list applies to tests.py as to
# server.py; these rules fire on patterns that are intentional in tests.
"tests.py" = [
    "assert",                       # S101 — asserts are the test pattern (337 hits)
    "private-member-access",        # SLF001 — tests poke srv._internal for monkey-patches (104 hits)
    "unused-async",                 # RUF029 — async generators (no `await`, `yield` only) — test fixture pattern
    "float-equality-comparison",    # RUF069 — float == on TOML-parsed config values — verifies parser fidelity, not FP arithmetic (14 hits)
    "module-import-not-at-top-of-file",   # E402 — `import server as srv` is intentionally after `load_dotenv()` so env vars are loaded before server reads them at import time
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["server.py", "tests.py"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.vulture]
paths = ["server.py", "tests.py", "vulture_whitelist.py"]
min_confidence = 60
# Decorators whose functions/classes vulture can't trace as used.
ignore_decorators = [
    "@app.*",          # FastAPI route handlers (`create_message`)
    "@field_validator", # Pydantic v2 field validators
    "@model_validator", # Pydantic v2 model validators
    "@override",       # PEP 698 — base-class signature mirrors
]
