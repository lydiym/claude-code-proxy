[project]
name = "anthropic-proxy"
version = "0.1.0"
description = "Proxy that translates the Anthropic API to OpenAI via LiteLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "litellm>=1.81.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["tests.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["server", "tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["server.py"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
